server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: oath-of-care-pharmacy-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:54322/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    # Deliberately off by default: remote schema changes require explicit owner approval.
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    sql-migration-prefix: ""
    sql-migration-separator: "_"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL:https://bxjgmuvhdxlvaekpofns.supabase.co}/auth/v1
          jwk-set-uri: ${SUPABASE_URL:https://bxjgmuvhdxlvaekpofns.supabase.co}/auth/v1/.well-known/jwks.json
          jws-algorithms:
            - ES256
            - RS256
          audiences: authenticated
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  supabase-url: ${SUPABASE_URL:https://bxjgmuvhdxlvaekpofns.supabase.co}
  supabase-publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
  ocr-url: ${OCR_API_URL:https://oathofcare-ocr.onrender.com}
  ocr-token: ${OCR_API_TOKEN:}
  challenge-pepper: ${SECURITY_CHALLENGE_PEPPER:development-only-change-me}
  mail-from: ${MAIL_FROM:no-reply@oathofcare.local}
  require-secure-secrets: ${REQUIRE_SECURE_SECRETS:false}

